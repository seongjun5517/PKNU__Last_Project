spring.application.name=project

# Hash plaintext passwords left from the pre-Spring-Security version.
# Disable this after the first successful migration in production.
app.security.migrate-legacy-passwords=true

spring.profiles.active=dev

spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.datasource.hikari.connection-init-sql=SET time_zone = '+09:00'

# Profile image upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
