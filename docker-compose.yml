# docker에게 어떤 컨테이너를 만들지 알려주는 설명서

services:
  mysql:
    image: mysql:8.0
    container_name: skin-mysql
    restart: always

    ports:
      - "13308:3306"

    environment:
      MYSQL_ROOT_PASSWORD: tripleskin
      MYSQL_DATABASE: skin_db
      MYSQL_USER: skin
      MYSQL_PASSWORD: 1234

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
