server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    proxy_intercept_errors on;

    error_page 502 503 = @service_unavailable;
    error_page 504 = @gateway_timeout;

    location /spring/ {
        proxy_pass http://spring:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    location /flask/ {
        proxy_pass http://yolo-flask:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
    }

    location /chatbot/ {
        proxy_pass http://chatbot-flask:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 190s;
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"message":"현재 서버를 사용할 수 없습니다. 잠시 후 다시 시도해주세요."}';
    }

    location @gateway_timeout {
        default_type application/json;
        return 504 '{"message":"요청 처리 시간이 초과되었습니다. 잠시 후 다시 시도해주세요."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
